services:
  postgres:
    image: postgres:15-alpine
    container_name: flux-postgres
    environment:
      POSTGRES_DB: flux
      POSTGRES_USER: flux_user
      POSTGRES_PASSWORD: flux_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flux_user -d flux"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
